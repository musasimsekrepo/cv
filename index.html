<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CV - Musa Simsek</title>
  <style>
    :root{
      --page-bg-1:#000000;
      --page-bg-2:#0b0b0b;
      --card-bg: rgba(255,255,255,0.02);
      --btn-bg: #111214;
      --btn-bg-hover: #1b1c1d;
      --btn-color: #ffffff;
      --muted: #9aa4b2;
      --radius:12px;
      --header-h:64px;
      --page-padding:12px;
      --maxw:1400px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:var(--btn-color);background:linear-gradient(180deg,var(--page-bg-1) 0%, var(--page-bg-2) 60%);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}

    .wrap{
      padding:var(--page-padding);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      width:100%;
      max-width:var(--maxw);
      height:calc(100vh - (var(--page-padding) * 2));
      border-radius:var(--radius);
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
      box-shadow:0 18px 60px rgba(0,0,0,0.7);
      border:1px solid rgba(255,255,255,0.02);
      display:flex;
      flex-direction:column;
    }

    header{
      height:var(--header-h);
      min-height:56px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 16px;
      background:transparent;
      border-bottom:1px solid rgba(255,255,255,0.03);
      flex:0 0 var(--header-h);
    }

    /* Başlık sol üstte (font 1 punto daha küçültüldü: 15 -> 14) */
    .title {
      display:flex;
      flex-direction:column;
      gap:2px;
      margin-left:6px;
    }
    .title h1{
      font-size:14px; /* 1 punto küçültüldü */
      margin:0;
      color:var(--btn-color);
      font-weight:700;
      letter-spacing:0.2px;
    }

    /* Buttons container: horizontal scroll on narrow screens so buttons never hide */
    .meta{
      margin-left:auto;
      display:flex;
      gap:8px;
      align-items:center;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      padding-bottom:2px;
    }
    .meta::-webkit-scrollbar{height:6px}
    .meta::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.03);border-radius:6px}
    .meta{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.03) transparent}

    /* ALL buttons identical style (no icons, same look)
       Font-size reduced by 1 point (from 12px -> 11px) as requested */
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:9px 14px;
      border-radius:10px;
      background:var(--btn-bg);
      color:var(--btn-color);
      border:1px solid rgba(255,255,255,0.04);
      font-weight:600;
      font-size:11px; /* 1 punto daha küçültüldü */
      cursor:pointer;
      white-space:nowrap;
      text-decoration:none;
      transition:background .12s ease, transform .06s ease;
      min-height:40px;
      line-height:1;
    }
    .btn:hover{background:var(--btn-bg-hover);transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn.ghost{
      background:var(--btn-bg);
      border:1px solid rgba(255,255,255,0.02);
    }

    .viewer{
      flex:1 1 auto;
      min-height:0;
      background:#0b0b0b;
      display:block;
    }
    iframe{width:100%;height:100%;border:0;display:block;background:#fff}

    @media (max-width:720px){
      :root{--header-h:56px}
      header{height:var(--header-h);padding:8px 12px}
      .title h1{font-size:13px} /* mobilde de 1 punto küçültüldü (14 -> 13) */
      .meta{gap:6px}
      .btn{padding:8px 10px;font-size:11px;min-height:36px} /* mobilde buton fontu 11px */
    }

    .btn:focus{outline:2px solid rgba(255,255,255,0.06);outline-offset:2px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-live="polite">
      <header>
        <!-- Başlık sol üstte -->
        <div class="title" aria-hidden="false">
          <h1>Curriculum Vitae</h1>
        </div>

        <!-- Butonlar: "Web'de Aç" olarak güncellendi -->
        <div class="meta" id="meta">
          <a id="downloadBtn" class="btn" href="./cv.pdf" download aria-label="PDF indir">PDF İndir</a>
          <a id="openBtn" class="btn ghost" target="_blank" rel="noopener" href="./cv.pdf" aria-label="PDF yeni sekmede aç">Web'de Aç</a>
        </div>
      </header>

      <div class="viewer" id="viewer">
        <iframe id="pdfFrame" src="./cv.pdf" title="CV PDF"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function(){
      // Fix viewer height to avoid mobile address-bar issues
      function fixViewerHeight(){
        const card = document.querySelector('.card');
        const header = document.querySelector('header');
        const viewer = document.getElementById('viewer');
        if(!card || !header || !viewer) return;
        const cardH = card.getBoundingClientRect().height;
        const headerH = header.getBoundingClientRect().height;
        viewer.style.height = Math.max(0, Math.floor(cardH - headerH)) + 'px';
      }
      window.addEventListener('resize', fixViewerHeight);
      window.addEventListener('orientationchange', fixViewerHeight);
      window.addEventListener('load', fixViewerHeight);
      setTimeout(fixViewerHeight, 200);
      setTimeout(fixViewerHeight, 800);
      setTimeout(fixViewerHeight, 1600);

      // Robust download behavior:
      const downloadBtn = document.getElementById('downloadBtn');
      const pdfPath = downloadBtn.getAttribute('href');

      downloadBtn.addEventListener('click', async function (e) {
        const ua = navigator.userAgent || '';
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);

        if (!isMobile) {
          return; // desktop: default anchor download
        }

        e.preventDefault();
        try {
          const resp = await fetch(pdfPath, { credentials: 'same-origin' });
          if (!resp.ok) throw new Error('Network response not ok');
          const blob = await resp.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          const filename = (pdfPath.split('/').pop() || 'cv.pdf').split('?')[0];
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);
        } catch (err) {
          window.open(pdfPath, '_blank', 'noopener');
        }
      });

      // Ensure "Web'de Aç" button behavior
      const openBtn = document.getElementById('openBtn');
      openBtn.textContent = "Web'de Aç";
      openBtn.setAttribute('target', '_blank');
      openBtn.setAttribute('rel', 'noopener');

    })();
  </script>
</body>
</html>
