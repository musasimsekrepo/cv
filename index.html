<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CV — PDF Viewer</title>
  <style>
    :root{
      --page-bg-1:#000000;
      --page-bg-2:#0b0b0b;
      --card-bg: rgba(255,255,255,0.02);
      --btn-bg: #111214;
      --btn-bg-hover: #1b1c1d;
      --btn-color: #ffffff;
      --muted: #9aa4b2;
      --radius:12px;
      --header-h:64px;
      --page-padding:12px;
      --maxw:1400px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:var(--btn-color);background:linear-gradient(180deg,var(--page-bg-1) 0%, var(--page-bg-2) 60%);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}

    .wrap{
      padding:var(--page-padding);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      width:100%;
      max-width:var(--maxw);
      height:calc(100vh - (var(--page-padding) * 2));
      border-radius:var(--radius);
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
      box-shadow:0 18px 60px rgba(0,0,0,0.7);
      border:1px solid rgba(255,255,255,0.02);
      display:flex;
      flex-direction:column;
    }

    header{
      height:var(--header-h);
      min-height:56px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 16px;
      background:transparent;
      border-bottom:1px solid rgba(255,255,255,0.03);
      flex:0 0 var(--header-h);
    }

    /* Başlık sol üstte */
    .title {
      display:flex;
      flex-direction:column;
      gap:2px;
      margin-left:6px;
    }
    .title h1{
      font-size:16px;
      margin:0;
      color:var(--btn-color);
      font-weight:700;
      letter-spacing:0.2px;
    }
    .title p{
      margin:0;
      font-size:12px;
      color:var(--muted);
      display:none; /* subtitle yok, istersen göster */
    }

    /* Buttons container: horizontal scroll on narrow screens so buttons never hide */
    .meta{
      margin-left:auto;
      display:flex;
      gap:8px;
      align-items:center;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      padding-bottom:2px;
    }
    .meta::-webkit-scrollbar{height:6px}
    .meta::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.03);border-radius:6px}
    .meta{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.03) transparent}

    /* ALL buttons identical style (no icons, same look) */
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:9px 14px;
      border-radius:10px;
      background:var(--btn-bg);
      color:var(--btn-color);
      border:1px solid rgba(255,255,255,0.04);
      font-weight:600;
      font-size:14px;
      cursor:pointer;
      white-space:nowrap;
      text-decoration:none;
      transition:background .12s ease, transform .06s ease;
      min-height:40px;
      line-height:1;
    }
    .btn:hover{background:var(--btn-bg-hover);transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn.ghost{
      background:var(--btn-bg);
      border:1px solid rgba(255,255,255,0.02);
    }

    .viewer{
      flex:1 1 auto;
      min-height:0;
      background:#0b0b0b;
      display:block;
    }
    iframe{width:100%;height:100%;border:0;display:block;background:#fff}

    @media (max-width:720px){
      :root{--header-h:56px}
      header{height:var(--header-h);padding:8px 12px}
      .title h1{font-size:15px}
      .meta{gap:6px}
      .btn{padding:8px 10px;font-size:13px;min-height:36px}
    }

    .btn:focus{outline:2px solid rgba(255,255,255,0.06);outline-offset:2px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-live="polite">
      <header>
        <!-- Başlık geri eklendi -->
        <div class="title" aria-hidden="false">
          <h1>Curriculum Vitae</h1>
        </div>

        <!-- Butonlar (aynı stil) -->
        <div class="meta" id="meta">
          <a class="btn" href="./cv.pdf" download aria-label="PDF indir">PDF İndir</a>
          <a class="btn ghost" target="_blank" rel="noopener" href="./cv.pdf" aria-label="PDF yeni sekmede aç">Aç</a>
        </div>
      </header>

      <div class="viewer" id="viewer">
        <iframe id="pdfFrame" src="./cv.pdf" title="CV PDF"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function(){
      // Ensure viewer height equals card height minus header height to avoid overflow on mobile
      function fixViewerHeight(){
        const card = document.querySelector('.card');
        const header = document.querySelector('header');
        const viewer = document.getElementById('viewer');
        if(!card || !header || !viewer) return;
        const cardH = card.getBoundingClientRect().height;
        const headerH = header.getBoundingClientRect().height;
        viewer.style.height = Math.max(0, Math.floor(cardH - headerH)) + 'px';
      }
      window.addEventListener('resize', fixViewerHeight);
      window.addEventListener('orientationchange', fixViewerHeight);
      window.addEventListener('load', fixViewerHeight);
      setTimeout(fixViewerHeight, 200);
      setTimeout(fixViewerHeight, 800);
      setTimeout(fixViewerHeight, 1600);
    })();
  </script>
</body>
</html>
