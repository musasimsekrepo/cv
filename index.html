<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CV — PDF Viewer</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#06b6d4;
      --muted:#9aa4b2;
      --glass: rgba(255,255,255,0.03);
      --radius:12px;
      --maxw:1100px;
    }
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:#e6eef6;background:linear-gradient(180deg,#071022 0%, #071827 60%);-webkit-font-smoothing:antialiased}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box}
    .card{width:100%;max-width:var(--maxw);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:var(--radius);box-shadow:0 8px 30px rgba(2,6,23,0.6);overflow:hidden;border:1px solid rgba(255,255,255,0.03);display:grid;grid-template-rows:auto 1fr;min-height:70vh}
    header{display:flex;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,0.02);background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent)}
    .logo{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;color:#021022;font-weight:700;font-size:18px;box-shadow:0 4px 18px rgba(6,182,212,0.12)}
    h1{font-size:16px;margin:0;color:#e6f7fb}
    .meta{margin-left:auto;display:flex;gap:8px;align-items:center}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--glass);color:var(--accent);text-decoration:none;border:1px solid rgba(6,182,212,0.08);font-weight:600;font-size:13px}
    .btn.primary{background:linear-gradient(90deg,var(--accent),#7c3aed);color:#021022;border:none;box-shadow:0 6px 18px rgba(6,182,212,0.12)}
    .viewer{height:calc(100% - 72px);display:block}
    iframe{width:100%;height:100%;border:0;background:#fff}
    .fallback{padding:18px;color:var(--muted);font-size:14px;text-align:center}
    .controls{display:flex;gap:8px;align-items:center}
    @media (max-width:720px){
      .card{min-height:60vh}
      header{padding:12px}
      .logo{width:36px;height:36px;font-size:15px}
      h1{font-size:14px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-label="CV Viewer">
      <header>
        <div class="logo">CV</div>
        <div>
          <h1>Curriculum Vitae</h1>
          <div style="color:var(--muted);font-size:13px">Europass / PDF</div>
        </div>

        <div class="meta">
          <div class="controls">
            <!-- İndir butonu -->
            <a class="btn" href="./cv.pdf" download aria-label="PDF indir">⬇ PDF İndir</a>
            <!-- Yeni sekmede aç -->
            <a class="btn" target="_blank" rel="noopener" href="./cv.pdf" aria-label="PDF yeni sekmede aç">↗ Aç</a>
            <!-- Basit paylaşım linki kopyalama -->
            <button class="btn" id="copyBtn" aria-label="Linki kopyala">🔗 Kopyala</button>
          </div>
        </div>
      </header>

      <!-- PDF gömme: relative path kullan -->
      <div class="viewer" id="viewer">
        <iframe id="pdfFrame" src="./cv.pdf"></iframe>
      </div>

      <div class="fallback" id="fallback" hidden>
        Tarayıcınız PDF gömme desteklemiyor. <a href="./cv.pdf" target="_blank" rel="noopener">PDF'i buradan indir veya aç</a>.
      </div>
    </div>
  </div>

  <script>
    // Basit fallback kontrolü: iframe yüklenmezse fallback göster
    (function(){
      const iframe = document.getElementById('pdfFrame');
      const fallback = document.getElementById('fallback');
      // Eğer iframe src'si yüklenmezse 2s sonra fallback göster
      let loaded = false;
      iframe.addEventListener('load', ()=> loaded = true);
      setTimeout(()=> {
        if(!loaded){
          iframe.style.display = 'none';
          fallback.hidden = false;
        }
      }, 2000);

      // Kopyala butonu: sayfa URL'sini kopyalar
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.addEventListener('click', async ()=>{
        const url = location.href.replace(/\/$/, '') + '/';
        try{
          await navigator.clipboard.writeText(url);
          copyBtn.textContent = 'Kopyalandı ✓';
          setTimeout(()=> copyBtn.textContent = '🔗 Kopyala', 1500);
        }catch(e){
          copyBtn.textContent = 'Kopyalama başarısız';
          setTimeout(()=> copyBtn.textContent = '🔗 Kopyala', 1500);
        }
      });
    })();
  </script>
</body>
</html>
